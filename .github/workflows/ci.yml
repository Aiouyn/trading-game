name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:paths -- origin/main
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'v3/quay-shell')
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
