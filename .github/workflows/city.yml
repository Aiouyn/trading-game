# City renderer (Spec 2, PR #4) — Producer-authorized, separate from Front Dev's ci.yml (PR #2).
# Runs the city unit suite (incl. C-16 paths) and the city e2e suite (incl. C-10 budgets) on
# Node 22. PRs are path-filtered; every push to main runs it in full.
# This workflow is the only owner of the city tests: ci.yml no longer runs them (PR #7). The
# whole-app lint/typecheck/build stays in ci.yml.
name: city
on:
  pull_request:
    paths:
      - 'src/city/**'
      - 'tests/unit/city/**'
      - 'tests/e2e/city/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/city.yml'
  push:
    # Every push to main runs the full city suite, no path filter: main can break the city through
    # files outside these paths (shared config, deps, merges), and the path filter left city.yml
    # last green at ca9b76c while main moved on. PR branches stay path-filtered (no double runs).
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e_args:
        description: 'Extra args for the e2e playwright step, e.g. "card1.spec.ts --repeat-each=5" (empty: the whole suite)'
        required: false
        default: ''
concurrency:
  group: city-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # google/fonts at a fixed commit: the faces the app self-hosts via next/font (OFL)
  FONTS_SHA: 47d54ca1ebb14fd864695f1d39dc734f39017c33
jobs:
  unit:
    name: city unit (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # C-16 diffs against the base branch
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: typecheck (city paths)
        run: npx tsc --noEmit -p tests/unit/city/tsconfig.json
      - name: lint (city paths)
        run: npx eslint src/city tests/unit/city tests/e2e/city
      - name: vitest (C-01, C-02, C-09, C-12, C-14, C-16, 17-AT-21 …)
        run: npx vitest run -c tests/unit/city/vitest.config.ts
        env:
          CITY_BASE_REF: origin/${{ github.base_ref || 'main' }}
  prod-hook:
    # AC (spec §9): a prod `next build` without NEXT_PUBLIC_CITY_E2E ships 0 e2e-hook strings in
    # .next/static; the flag=1 build is the positive control. Two builds, about 1 min.
    name: city prod build has no e2e hook (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node tests/e2e/city/prod-hook-check.mjs
  e2e:
    name: city e2e (Node 22, Chromium + SwiftShader)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: fonts (Inter, Instrument Serif, JetBrains Mono)
        run: |
          d="$RUNNER_TEMP/fonts"
          mkdir -p "$d/Instrument Serif" "$d/Inter" "$d/JetBrains Mono"
          base="https://raw.githubusercontent.com/google/fonts/$FONTS_SHA/ofl"
          curl -fsSL -o "$d/Instrument Serif/InstrumentSerif-Regular.ttf" "$base/instrumentserif/InstrumentSerif-Regular.ttf"
          curl -fsSL -o "$d/Inter/Inter-VariableFont_opsz,wght.ttf" "$base/inter/Inter%5Bopsz,wght%5D.ttf"
          curl -fsSL -o "$d/JetBrains Mono/JetBrainsMono-VariableFont_wght.ttf" "$base/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"
          echo "CITY_FONTS_DIR=$d" >> "$GITHUB_ENV"
      - name: playwright (C-03 … C-15, incl. C-10 budgets)
        run: npx playwright test -c tests/e2e/city/playwright.config.ts $E2E_ARGS
        env:
          E2E_ARGS: ${{ inputs.e2e_args }} # dispatch only; empty on push/PR
          CI: 'true' # GitHub's own value; loop.spec's real-clock check runs only when CI === 'true'
          CITY_EVIDENCE_DIR: ${{ runner.temp }}/city-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-evidence
          path: ${{ runner.temp }}/city-evidence
          retention-days: 14
  t0-ab:
    # Producer's ruling on #60: T0's longest task is compared against main's city built and sampled
    # in this same job (5 interleaved runs each, medians, <= 1.1x), not against a number from
    # another run. PRs only: on main the merge-base is HEAD itself.
    name: city T0 A/B vs main (Node 22, Chromium + SwiftShader)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: fonts (Inter, Instrument Serif, JetBrains Mono)
        run: |
          d="$RUNNER_TEMP/fonts"
          mkdir -p "$d/Instrument Serif" "$d/Inter" "$d/JetBrains Mono"
          base="https://raw.githubusercontent.com/google/fonts/$FONTS_SHA/ofl"
          curl -fsSL -o "$d/Instrument Serif/InstrumentSerif-Regular.ttf" "$base/instrumentserif/InstrumentSerif-Regular.ttf"
          curl -fsSL -o "$d/Inter/Inter-VariableFont_opsz,wght.ttf" "$base/inter/Inter%5Bopsz,wght%5D.ttf"
          curl -fsSL -o "$d/JetBrains Mono/JetBrainsMono-VariableFont_wght.ttf" "$base/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"
          echo "CITY_FONTS_DIR=$d" >> "$GITHUB_ENV"
      - name: main's city harness (merge-base), served on 3211
        run: |
          base=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          echo "A/B base: $base ($(git log -1 --format=%s "$base"))"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          if cmp -s package-lock.json "$RUNNER_TEMP/base/package-lock.json"; then ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"; else (cd "$RUNNER_TEMP/base" && npm ci); fi
          (cd "$RUNNER_TEMP/base" && CITY_HARNESS_OUT="$RUNNER_TEMP/h-base" npx vite build -c tests/e2e/city/harness/vite.config.ts)
          nohup node tests/e2e/city/serve.mjs "$RUNNER_TEMP/h-base" 3211 > "$RUNNER_TEMP/serve-base.log" 2>&1 &
          for i in $(seq 30); do curl -fs -o /dev/null http://localhost:3211/city.html && exit 0; sleep 1; done; exit 1
      - name: T0 A/B (5 interleaved runs each, per viewport)
        run: npx playwright test -c tests/e2e/city/playwright.config.ts t0-ab.spec.ts
        env:
          CI: 'true'
          CITY_AB_BASE_URL: http://localhost:3211
          CITY_EVIDENCE_DIR: ${{ runner.temp }}/city-ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-t0-ab
          path: ${{ runner.temp }}/city-ab
          retention-days: 14
